[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzleai-employee"
version = "0.1.0"
description = "PuzzleAI Employee maze book generator"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
